<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="ew-halo" cx="0.5" cy="0.5" r="0.55">
			<stop offset="0%" stop-color="rgba(239,68,68,0.65)"/>
			<stop offset="55%" stop-color="rgba(239,68,68,0.18)"/>
			<stop offset="100%" stop-color="rgba(239,68,68,0)"/>
		</radialGradient>
		<linearGradient id="ew-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#FECACA"/>
			<stop offset="35%" stop-color="#EF4444"/>
			<stop offset="100%" stop-color="#7F1D1D"/>
		</linearGradient>
		<linearGradient id="ew-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#B91C1C"/>
			<stop offset="100%" stop-color="#450A0A"/>
		</linearGradient>
		<radialGradient id="ew-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<radialGradient id="ew-flame" cx="0.5" cy="0.7" r="0.7">
			<stop offset="0%" stop-color="#FEF08A"/>
			<stop offset="55%" stop-color="#F97316"/>
			<stop offset="100%" stop-color="#7F1D1D"/>
		</radialGradient>
		<radialGradient id="ew-gem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="60%" stop-color="#FFD700"/>
			<stop offset="100%" stop-color="#92400E"/>
		</radialGradient>
	</defs>
	<!-- Halo -->
	<circle cx="70" cy="72" r="68" fill="url(#ew-halo)"/>
	<!-- Phoenix flame on top -->
	<g transform="translate(70, 26)">
		<path d="M0,-22 Q-12,-8 -14,4 Q-14,18 0,22 Q14,18 14,4 Q12,-8 0,-22 Z" fill="url(#ew-flame)" stroke="#7F1D1D" stroke-width="1"/>
		<path d="M0,-12 Q-6,-2 -7,6 Q-7,14 0,16 Q7,14 7,6 Q6,-2 0,-12 Z" fill="#FEF08A" opacity="0.7"/>
		<!-- Wings -->
		<path d="M-14,4 Q-22,2 -22,-6 Q-18,0 -14,2" fill="#F97316" stroke="#7F1D1D" stroke-width="0.6"/>
		<path d="M14,4 Q22,2 22,-6 Q18,0 14,2" fill="#F97316" stroke="#7F1D1D" stroke-width="0.6"/>
	</g>
	<!-- Cup body -->
	<path d="M38,46 L102,46 Q104,76 90,96 L50,96 Q36,76 38,46 Z" fill="url(#ew-cup)" stroke="#7F1D1D" stroke-width="0.8"/>
	<!-- Gold trim band -->
	<rect x="38" y="58" width="64" height="3" fill="#FFD700" opacity="0.7"/>
	<rect x="42" y="86" width="56" height="2" fill="#FFD700" opacity="0.6"/>
	<!-- Handles -->
	<path d="M38,54 Q18,54 18,72 Q18,88 38,88" stroke="url(#ew-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<path d="M102,54 Q122,54 122,72 Q122,88 102,88" stroke="url(#ew-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="64" rx="9" ry="22" fill="url(#ew-shine)"/>
	<!-- Center medallion (gold) -->
	<circle cx="70" cy="72" r="13" fill="#FFD700" stroke="#7F1D1D" stroke-width="1.6"/>
	<circle cx="70" cy="72" r="9" fill="url(#ew-gem)" stroke="#92400E" stroke-width="0.6"/>
	<polygon points="68,68 72,68 70,76" fill="rgba(255,255,255,0.55)"/>
	<!-- Stem -->
	<rect x="58" y="96" width="24" height="16" fill="url(#ew-base)"/>
	<!-- Base -->
	<rect x="42" y="112" width="56" height="11" rx="2" fill="url(#ew-base)"/>
	<rect x="32" y="123" width="76" height="14" rx="3" fill="url(#ew-base)"/>
	<rect x="26" y="137" width="88" height="6" rx="2" fill="#450A0A"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="148" rx="40" ry="3" fill="rgba(0,0,0,0.25)"/>
</svg>
