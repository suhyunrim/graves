<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="lk-halo" cx="0.5" cy="0.5" r="0.55">
			<stop offset="0%" stop-color="rgba(16,185,129,0.65)"/>
			<stop offset="55%" stop-color="rgba(16,185,129,0.18)"/>
			<stop offset="100%" stop-color="rgba(16,185,129,0)"/>
		</radialGradient>
		<linearGradient id="lk-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#A7F3D0"/>
			<stop offset="35%" stop-color="#10B981"/>
			<stop offset="100%" stop-color="#064E3B"/>
		</linearGradient>
		<linearGradient id="lk-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#047857"/>
			<stop offset="100%" stop-color="#022C22"/>
		</linearGradient>
		<radialGradient id="lk-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<radialGradient id="lk-gem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#D1FAE5"/>
			<stop offset="50%" stop-color="#10B981"/>
			<stop offset="100%" stop-color="#064E3B"/>
		</radialGradient>
	</defs>
	<!-- Halo -->
	<circle cx="70" cy="72" r="68" fill="url(#lk-halo)"/>
	<!-- Golden laurel wreath on top -->
	<g transform="translate(70, 26)">
		<!-- Left laurel branch -->
		<path d="M-4,16 Q-18,10 -22,-4 Q-22,-12 -16,-18" stroke="#B45309" stroke-width="1.6" fill="none"/>
		<ellipse cx="-20" cy="-12" rx="3" ry="5" transform="rotate(-25 -20 -12)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<ellipse cx="-22" cy="-2" rx="3" ry="5" transform="rotate(-10 -22 -2)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<ellipse cx="-18" cy="6" rx="3" ry="5" transform="rotate(20 -18 6)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<ellipse cx="-10" cy="13" rx="3" ry="5" transform="rotate(45 -10 13)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<!-- Right laurel branch -->
		<path d="M4,16 Q18,10 22,-4 Q22,-12 16,-18" stroke="#B45309" stroke-width="1.6" fill="none"/>
		<ellipse cx="20" cy="-12" rx="3" ry="5" transform="rotate(25 20 -12)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<ellipse cx="22" cy="-2" rx="3" ry="5" transform="rotate(10 22 -2)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<ellipse cx="18" cy="6" rx="3" ry="5" transform="rotate(-20 18 6)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<ellipse cx="10" cy="13" rx="3" ry="5" transform="rotate(-45 10 13)" fill="#FCD34D" stroke="#92400E" stroke-width="0.5"/>
		<!-- Center gem -->
		<circle cx="0" cy="-6" r="6" fill="url(#lk-gem)" stroke="#064E3B" stroke-width="0.8"/>
		<polygon points="-2,-9 2,-9 0,-3" fill="rgba(255,255,255,0.55)"/>
	</g>
	<!-- Cup body -->
	<path d="M38,46 L102,46 Q104,76 90,96 L50,96 Q36,76 38,46 Z" fill="url(#lk-cup)" stroke="#064E3B" stroke-width="0.8"/>
	<!-- Gold trim -->
	<rect x="38" y="58" width="64" height="3" fill="#FCD34D" opacity="0.7"/>
	<rect x="42" y="86" width="56" height="2" fill="#FCD34D" opacity="0.6"/>
	<!-- Handles -->
	<path d="M38,54 Q18,54 18,72 Q18,88 38,88" stroke="url(#lk-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<path d="M102,54 Q122,54 122,72 Q122,88 102,88" stroke="url(#lk-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="64" rx="9" ry="22" fill="url(#lk-shine)"/>
	<!-- Center medallion (gold) -->
	<circle cx="70" cy="72" r="13" fill="#FCD34D" stroke="#064E3B" stroke-width="1.6"/>
	<circle cx="70" cy="72" r="9" fill="url(#lk-gem)" stroke="#064E3B" stroke-width="0.6"/>
	<polygon points="68,68 72,68 70,76" fill="rgba(255,255,255,0.55)"/>
	<!-- Stem -->
	<rect x="58" y="96" width="24" height="16" fill="url(#lk-base)"/>
	<!-- Base -->
	<rect x="42" y="112" width="56" height="11" rx="2" fill="url(#lk-base)"/>
	<rect x="32" y="123" width="76" height="14" rx="3" fill="url(#lk-base)"/>
	<rect x="26" y="137" width="88" height="6" rx="2" fill="#022C22"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="148" rx="40" ry="3" fill="rgba(0,0,0,0.25)"/>
</svg>
