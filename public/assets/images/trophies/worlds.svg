<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="w-halo" cx="0.5" cy="0.5" r="0.55">
			<stop offset="0%" stop-color="rgba(255,215,0,0.65)"/>
			<stop offset="55%" stop-color="rgba(255,215,0,0.18)"/>
			<stop offset="100%" stop-color="rgba(255,215,0,0)"/>
		</radialGradient>
		<linearGradient id="w-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#FFF6BF"/>
			<stop offset="35%" stop-color="#FFD700"/>
			<stop offset="100%" stop-color="#9C6800"/>
		</linearGradient>
		<linearGradient id="w-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#C8941A"/>
			<stop offset="100%" stop-color="#5C3A00"/>
		</linearGradient>
		<radialGradient id="w-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<radialGradient id="w-gem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#FECACA"/>
			<stop offset="50%" stop-color="#EF4444"/>
			<stop offset="100%" stop-color="#7F1D1D"/>
		</radialGradient>
	</defs>
	<!-- Halo -->
	<circle cx="70" cy="72" r="68" fill="url(#w-halo)"/>
	<!-- Big radiant star on top -->
	<g transform="translate(70, 26)">
		<polygon points="0,-22 6,-6 23,-6 9,4 14,21 0,11 -14,21 -9,4 -23,-6 -6,-6" fill="#FFE066" stroke="#7A5000" stroke-width="1.2"/>
		<polygon points="0,-12 3,-3 11,-3 5,2 7,11 0,6 -7,11 -5,2 -11,-3 -3,-3" fill="#FFFAE5"/>
	</g>
	<!-- Cup body -->
	<path d="M38,46 L102,46 Q104,76 90,96 L50,96 Q36,76 38,46 Z" fill="url(#w-cup)" stroke="#7A5000" stroke-width="0.8"/>
	<!-- Gold trim band -->
	<rect x="38" y="58" width="64" height="3" fill="#FFE066" opacity="0.6"/>
	<rect x="42" y="86" width="56" height="2" fill="#FFE066" opacity="0.5"/>
	<!-- Handles -->
	<path d="M38,54 Q18,54 18,72 Q18,88 38,88" stroke="url(#w-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<path d="M102,54 Q122,54 122,72 Q122,88 102,88" stroke="url(#w-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="64" rx="9" ry="22" fill="url(#w-shine)"/>
	<!-- Center medallion -->
	<circle cx="70" cy="72" r="13" fill="#FFE066" stroke="#7A5000" stroke-width="1.6"/>
	<circle cx="70" cy="72" r="9" fill="url(#w-gem)" stroke="#7A5000" stroke-width="0.6"/>
	<polygon points="68,68 72,68 70,76" fill="rgba(255,255,255,0.55)"/>
	<!-- Stem -->
	<rect x="58" y="96" width="24" height="16" fill="url(#w-base)"/>
	<!-- Base -->
	<rect x="42" y="112" width="56" height="11" rx="2" fill="url(#w-base)"/>
	<rect x="32" y="123" width="76" height="14" rx="3" fill="url(#w-base)"/>
	<rect x="26" y="137" width="88" height="6" rx="2" fill="#3D2600"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="148" rx="40" ry="3" fill="rgba(0,0,0,0.25)"/>
</svg>
