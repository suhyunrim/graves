<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="t6-halo" cx="0.5" cy="0.5" r="0.62">
			<stop offset="0%" stop-color="rgba(255,215,0,0.85)"/>
			<stop offset="40%" stop-color="rgba(255,215,0,0.32)"/>
			<stop offset="100%" stop-color="rgba(255,215,0,0)"/>
		</radialGradient>
		<radialGradient id="t6-halo2" cx="0.5" cy="0.5" r="0.78">
			<stop offset="0%" stop-color="rgba(255,255,200,0)"/>
			<stop offset="55%" stop-color="rgba(255,235,150,0.18)"/>
			<stop offset="100%" stop-color="rgba(255,235,150,0)"/>
		</radialGradient>
		<linearGradient id="t6-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#FFFFEB"/>
			<stop offset="20%" stop-color="#FFEB99"/>
			<stop offset="55%" stop-color="#FFD700"/>
			<stop offset="100%" stop-color="#7A5000"/>
		</linearGradient>
		<linearGradient id="t6-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#D69E1A"/>
			<stop offset="100%" stop-color="#3D2600"/>
		</linearGradient>
		<radialGradient id="t6-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<radialGradient id="t6-gem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#FECACA"/>
			<stop offset="50%" stop-color="#EF4444"/>
			<stop offset="100%" stop-color="#7F1D1D"/>
		</radialGradient>
		<radialGradient id="t6-bluegem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#DBEAFE"/>
			<stop offset="50%" stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E3A8A"/>
		</radialGradient>
	</defs>
	<!-- Tier 6: Pinnacle / Summoner's Cup style — biggest, halo+rays+wings+crown+star -->
	<!-- Outer halo + inner glow -->
	<circle cx="70" cy="74" r="78" fill="url(#t6-halo2)"/>
	<circle cx="70" cy="74" r="62" fill="url(#t6-halo)"/>
	<!-- Light rays -->
	<g stroke="#FFE066" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
		<line x1="70" y1="0" x2="70" y2="14"/>
		<line x1="36" y1="6" x2="44" y2="20"/>
		<line x1="104" y1="6" x2="96" y2="20"/>
		<line x1="14" y1="22" x2="26" y2="32"/>
		<line x1="126" y1="22" x2="114" y2="32"/>
		<line x1="4" y1="56" x2="14" y2="58"/>
		<line x1="136" y1="56" x2="126" y2="58"/>
	</g>
	<!-- Sparkle stars -->
	<g fill="#FFFFFF">
		<polygon points="14,46 17,38 20,46 17,54"/>
		<polygon points="14,46 6,43 14,46 22,43"/>
		<polygon points="120,40 123,32 126,40 123,48"/>
		<polygon points="120,40 112,37 120,40 128,37"/>
		<polygon points="22,100 24,95 26,100 24,105"/>
		<polygon points="114,104 116,99 118,104 116,109"/>
	</g>
	<!-- Wings -->
	<g fill="#FFE066" stroke="#7A5000" stroke-width="0.8" opacity="0.95">
		<!-- Left wing -->
		<path d="M30,58 Q12,52 4,62 Q14,64 18,68 Q8,68 2,76 Q14,76 22,72 Q12,80 8,90 Q22,82 30,72 Z"/>
		<!-- Right wing -->
		<path d="M110,58 Q128,52 136,62 Q126,64 122,68 Q132,68 138,76 Q126,76 118,72 Q128,80 132,90 Q118,82 110,72 Z"/>
	</g>
	<!-- Crown w/ giant star on top -->
	<g transform="translate(70, 24)">
		<!-- Crown band -->
		<path d="M-16,10 L-16,-2 L-9,5 L-4,-8 L0,2 L4,-8 L9,5 L16,-2 L16,10 Z" fill="#FFD700" stroke="#7A5000" stroke-width="1"/>
		<rect x="-16" y="10" width="32" height="3" fill="#B45309"/>
		<circle cx="-9" cy="5" r="2" fill="url(#t6-bluegem)"/>
		<circle cx="9" cy="5" r="2" fill="url(#t6-bluegem)"/>
		<circle cx="0" cy="2" r="2.6" fill="url(#t6-gem)"/>
		<!-- Big radiant star above crown -->
		<polygon points="0,-22 5,-9 18,-9 8,-1 12,12 0,4 -12,12 -8,-1 -18,-9 -5,-9" fill="#FFE066" stroke="#7A5000" stroke-width="1"/>
		<polygon points="0,-13 2,-4 9,-4 4,1 6,9 0,5 -6,9 -4,1 -9,-4 -2,-4" fill="#FFFAE5"/>
	</g>
	<!-- Cup body (taller / larger) -->
	<path d="M36,48 L104,48 Q106,80 90,100 L50,100 Q34,80 36,48 Z" fill="url(#t6-cup)" stroke="#7A5000" stroke-width="1"/>
	<!-- Engraved trim -->
	<rect x="36" y="60" width="68" height="3.5" fill="#FFE066" opacity="0.7"/>
	<rect x="36" y="65" width="68" height="1" fill="#7A5000" opacity="0.5"/>
	<rect x="40" y="90" width="60" height="2.5" fill="#FFE066" opacity="0.6"/>
	<rect x="40" y="93" width="60" height="0.8" fill="#7A5000" opacity="0.5"/>
	<!-- Side gems -->
	<circle cx="44" cy="80" r="3" fill="url(#t6-gem)" stroke="#7A5000" stroke-width="0.5"/>
	<circle cx="96" cy="80" r="3" fill="url(#t6-gem)" stroke="#7A5000" stroke-width="0.5"/>
	<circle cx="50" cy="74" r="1.6" fill="url(#t6-bluegem)"/>
	<circle cx="90" cy="74" r="1.6" fill="url(#t6-bluegem)"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="66" rx="10" ry="24" fill="url(#t6-shine)"/>
	<!-- Center medallion (large, double rim) -->
	<circle cx="70" cy="74" r="15" fill="#FFE066" stroke="#7A5000" stroke-width="1.8"/>
	<circle cx="70" cy="74" r="12" fill="#FFD700" stroke="#7A5000" stroke-width="0.8"/>
	<circle cx="70" cy="74" r="8.5" fill="url(#t6-gem)" stroke="#7A5000" stroke-width="0.5"/>
	<polygon points="68,70 72,70 70,79" fill="rgba(255,255,255,0.55)"/>
	<!-- Stem w/ collar -->
	<rect x="56" y="100" width="28" height="16" fill="url(#t6-base)"/>
	<rect x="54" y="100" width="32" height="3.5" fill="#FFD700" opacity="0.85"/>
	<rect x="54" y="113" width="32" height="3.5" fill="#FFD700" opacity="0.85"/>
	<!-- Multi-tier base -->
	<rect x="40" y="116" width="60" height="11" rx="2" fill="url(#t6-base)"/>
	<rect x="42" y="118" width="56" height="2" fill="#FFE066" opacity="0.6"/>
	<rect x="28" y="127" width="84" height="14" rx="3" fill="url(#t6-base)"/>
	<rect x="32" y="130" width="76" height="2" fill="#FFE066" opacity="0.5"/>
	<rect x="22" y="141" width="96" height="6" rx="2" fill="#3D2600"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="152" rx="48" ry="3.8" fill="rgba(0,0,0,0.35)"/>
</svg>
