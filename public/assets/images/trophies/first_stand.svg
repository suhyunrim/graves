<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="fs-halo" cx="0.5" cy="0.5" r="0.55">
			<stop offset="0%" stop-color="rgba(56,189,248,0.65)"/>
			<stop offset="55%" stop-color="rgba(56,189,248,0.18)"/>
			<stop offset="100%" stop-color="rgba(56,189,248,0)"/>
		</radialGradient>
		<linearGradient id="fs-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#E0F2FE"/>
			<stop offset="35%" stop-color="#38BDF8"/>
			<stop offset="100%" stop-color="#075985"/>
		</linearGradient>
		<linearGradient id="fs-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0369A1"/>
			<stop offset="100%" stop-color="#082F49"/>
		</linearGradient>
		<radialGradient id="fs-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<linearGradient id="fs-diamond" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="50%" stop-color="#7DD3FC"/>
			<stop offset="100%" stop-color="#0284C7"/>
		</linearGradient>
	</defs>
	<!-- Halo -->
	<circle cx="70" cy="72" r="68" fill="url(#fs-halo)"/>
	<!-- Big diamond gem on top -->
	<g transform="translate(70, 26)">
		<polygon points="0,-22 18,-2 0,22 -18,-2" fill="url(#fs-diamond)" stroke="#082F49" stroke-width="1.2"/>
		<line x1="-18" y1="-2" x2="18" y2="-2" stroke="#082F49" stroke-width="0.6"/>
		<line x1="-9" y1="-12" x2="0" y2="-2" stroke="rgba(255,255,255,0.5)" stroke-width="0.6"/>
		<line x1="9" y1="-12" x2="0" y2="-2" stroke="rgba(255,255,255,0.5)" stroke-width="0.6"/>
		<polygon points="-3,-15 0,-22 3,-15 0,-12" fill="rgba(255,255,255,0.7)"/>
	</g>
	<!-- Cup body -->
	<path d="M38,46 L102,46 Q104,76 90,96 L50,96 Q36,76 38,46 Z" fill="url(#fs-cup)" stroke="#082F49" stroke-width="0.8"/>
	<rect x="38" y="58" width="64" height="3" fill="#E0F2FE" opacity="0.5"/>
	<rect x="42" y="86" width="56" height="2" fill="#E0F2FE" opacity="0.4"/>
	<!-- Handles -->
	<path d="M38,54 Q18,54 18,72 Q18,88 38,88" stroke="url(#fs-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<path d="M102,54 Q122,54 122,72 Q122,88 102,88" stroke="url(#fs-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="64" rx="9" ry="22" fill="url(#fs-shine)"/>
	<!-- Center medallion -->
	<circle cx="70" cy="72" r="13" fill="#E0F2FE" stroke="#082F49" stroke-width="1.6"/>
	<polygon points="70,64 78,72 70,80 62,72" fill="url(#fs-diamond)" stroke="#082F49" stroke-width="0.6"/>
	<line x1="62" y1="72" x2="78" y2="72" stroke="#082F49" stroke-width="0.4"/>
	<!-- Stem -->
	<rect x="58" y="96" width="24" height="16" fill="url(#fs-base)"/>
	<!-- Base -->
	<rect x="42" y="112" width="56" height="11" rx="2" fill="url(#fs-base)"/>
	<rect x="32" y="123" width="76" height="14" rx="3" fill="url(#fs-base)"/>
	<rect x="26" y="137" width="88" height="6" rx="2" fill="#082F49"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="148" rx="40" ry="3" fill="rgba(0,0,0,0.25)"/>
</svg>
