<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="sapphire-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#BAE6FD"/>
			<stop offset="35%" stop-color="#38BDF8"/>
			<stop offset="100%" stop-color="#075985"/>
		</linearGradient>
		<linearGradient id="sapphire-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0369A1"/>
			<stop offset="100%" stop-color="#082F49"/>
		</linearGradient>
		<linearGradient id="diamond-grad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#E0F2FE"/>
			<stop offset="100%" stop-color="#0EA5E9"/>
		</linearGradient>
		<radialGradient id="sapphire-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
	</defs>
	<!-- Diamond gem on top -->
	<polygon points="60,4 72,16 60,32 48,16" fill="url(#diamond-grad)" stroke="#0369A1" stroke-width="1"/>
	<line x1="48" y1="16" x2="72" y2="16" stroke="#0369A1" stroke-width="0.5"/>
	<line x1="60" y1="4" x2="60" y2="32" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
	<!-- Cup body -->
	<path d="M30,32 L90,32 Q92,62 78,82 L42,82 Q28,62 30,32 Z" fill="url(#sapphire-cup)" stroke="#0C4A6E" stroke-width="0.6"/>
	<!-- Handles -->
	<path d="M30,40 Q12,40 12,58 Q12,74 30,74" stroke="url(#sapphire-cup)" stroke-width="6" fill="none" stroke-linecap="round"/>
	<path d="M90,40 Q108,40 108,58 Q108,74 90,74" stroke="url(#sapphire-cup)" stroke-width="6" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="45" cy="50" rx="8" ry="22" fill="url(#sapphire-shine)"/>
	<!-- Stem -->
	<rect x="50" y="82" width="20" height="16" fill="url(#sapphire-base)"/>
	<!-- Base tiers -->
	<rect x="35" y="98" width="50" height="10" rx="2" fill="url(#sapphire-base)"/>
	<rect x="25" y="108" width="70" height="14" rx="3" fill="url(#sapphire-base)"/>
	<rect x="20" y="122" width="80" height="6" rx="2" fill="#082F49"/>
</svg>
