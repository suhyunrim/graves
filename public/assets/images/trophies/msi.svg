<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="m-halo" cx="0.5" cy="0.5" r="0.55">
			<stop offset="0%" stop-color="rgba(186,230,253,0.6)"/>
			<stop offset="55%" stop-color="rgba(186,230,253,0.15)"/>
			<stop offset="100%" stop-color="rgba(186,230,253,0)"/>
		</radialGradient>
		<linearGradient id="m-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="35%" stop-color="#D9DEE5"/>
			<stop offset="100%" stop-color="#525B6B"/>
		</linearGradient>
		<linearGradient id="m-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#9CA3AF"/>
			<stop offset="100%" stop-color="#1F2937"/>
		</linearGradient>
		<radialGradient id="m-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<radialGradient id="m-gem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#DBEAFE"/>
			<stop offset="50%" stop-color="#3B82F6"/>
			<stop offset="100%" stop-color="#1E3A8A"/>
		</radialGradient>
	</defs>
	<!-- Halo -->
	<circle cx="70" cy="72" r="68" fill="url(#m-halo)"/>
	<!-- Crown on top -->
	<g transform="translate(70, 24)">
		<path d="M-22,12 L-22,-2 L-12,8 L-6,-12 L0,4 L6,-12 L12,8 L22,-2 L22,12 Z" fill="#E5E7EB" stroke="#374151" stroke-width="1.2"/>
		<rect x="-22" y="12" width="44" height="4" fill="#9CA3AF" stroke="#374151" stroke-width="0.8"/>
		<circle cx="-12" cy="8" r="3" fill="url(#m-gem)" stroke="#1E3A8A" stroke-width="0.5"/>
		<circle cx="0" cy="4" r="3.5" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.5"/>
		<circle cx="12" cy="8" r="3" fill="url(#m-gem)" stroke="#1E3A8A" stroke-width="0.5"/>
	</g>
	<!-- Cup body -->
	<path d="M38,46 L102,46 Q104,76 90,96 L50,96 Q36,76 38,46 Z" fill="url(#m-cup)" stroke="#374151" stroke-width="0.8"/>
	<rect x="38" y="58" width="64" height="3" fill="#FFFFFF" opacity="0.5"/>
	<rect x="42" y="86" width="56" height="2" fill="#FFFFFF" opacity="0.4"/>
	<!-- Handles -->
	<path d="M38,54 Q18,54 18,72 Q18,88 38,88" stroke="url(#m-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<path d="M102,54 Q122,54 122,72 Q122,88 102,88" stroke="url(#m-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="64" rx="9" ry="22" fill="url(#m-shine)"/>
	<!-- Center medallion -->
	<circle cx="70" cy="72" r="13" fill="#F3F4F6" stroke="#374151" stroke-width="1.6"/>
	<circle cx="70" cy="72" r="9" fill="url(#m-gem)" stroke="#374151" stroke-width="0.6"/>
	<polygon points="68,68 72,68 70,76" fill="rgba(255,255,255,0.55)"/>
	<!-- Stem -->
	<rect x="58" y="96" width="24" height="16" fill="url(#m-base)"/>
	<!-- Base -->
	<rect x="42" y="112" width="56" height="11" rx="2" fill="url(#m-base)"/>
	<rect x="32" y="123" width="76" height="14" rx="3" fill="url(#m-base)"/>
	<rect x="26" y="137" width="88" height="6" rx="2" fill="#111827"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="148" rx="40" ry="3" fill="rgba(0,0,0,0.25)"/>
</svg>
