<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="ks-halo" cx="0.5" cy="0.5" r="0.55">
			<stop offset="0%" stop-color="rgba(168,85,247,0.65)"/>
			<stop offset="55%" stop-color="rgba(168,85,247,0.18)"/>
			<stop offset="100%" stop-color="rgba(168,85,247,0)"/>
		</radialGradient>
		<linearGradient id="ks-cup" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#E9D5FF"/>
			<stop offset="35%" stop-color="#A855F7"/>
			<stop offset="100%" stop-color="#4C1D95"/>
		</linearGradient>
		<linearGradient id="ks-base" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#7C3AED"/>
			<stop offset="100%" stop-color="#2E1065"/>
		</linearGradient>
		<radialGradient id="ks-shine" cx="0.3" cy="0.2" r="0.6">
			<stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
			<stop offset="100%" stop-color="rgba(255,255,255,0)"/>
		</radialGradient>
		<radialGradient id="ks-gem" cx="0.4" cy="0.3" r="0.7">
			<stop offset="0%" stop-color="#F5D0FE"/>
			<stop offset="50%" stop-color="#A855F7"/>
			<stop offset="100%" stop-color="#4C1D95"/>
		</radialGradient>
		<radialGradient id="ks-burst" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0%" stop-color="#FFFFFF"/>
			<stop offset="60%" stop-color="#F0ABFC"/>
			<stop offset="100%" stop-color="#7E22CE"/>
		</radialGradient>
	</defs>
	<!-- Halo -->
	<circle cx="70" cy="72" r="68" fill="url(#ks-halo)"/>
	<!-- Sparkle burst on top -->
	<g transform="translate(70, 26)">
		<polygon points="0,-22 4,-4 22,0 4,4 0,22 -4,4 -22,0 -4,-4" fill="url(#ks-burst)" stroke="#4C1D95" stroke-width="1"/>
		<polygon points="0,-12 2,-2 12,0 2,2 0,12 -2,2 -12,0 -2,-2" fill="#FFFFFF" opacity="0.8"/>
		<!-- Diagonal mini sparkles -->
		<g stroke="#F0ABFC" stroke-width="1" stroke-linecap="round">
			<line x1="-15" y1="-15" x2="-10" y2="-10"/>
			<line x1="15" y1="-15" x2="10" y2="-10"/>
			<line x1="-15" y1="15" x2="-10" y2="10"/>
			<line x1="15" y1="15" x2="10" y2="10"/>
		</g>
	</g>
	<!-- Cup body -->
	<path d="M38,46 L102,46 Q104,76 90,96 L50,96 Q36,76 38,46 Z" fill="url(#ks-cup)" stroke="#4C1D95" stroke-width="0.8"/>
	<!-- Silver trim -->
	<rect x="38" y="58" width="64" height="3" fill="#F5D0FE" opacity="0.6"/>
	<rect x="42" y="86" width="56" height="2" fill="#F5D0FE" opacity="0.5"/>
	<!-- Handles -->
	<path d="M38,54 Q18,54 18,72 Q18,88 38,88" stroke="url(#ks-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<path d="M102,54 Q122,54 122,72 Q122,88 102,88" stroke="url(#ks-cup)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
	<!-- Highlight -->
	<ellipse cx="54" cy="64" rx="9" ry="22" fill="url(#ks-shine)"/>
	<!-- Center medallion -->
	<circle cx="70" cy="72" r="13" fill="#F5D0FE" stroke="#4C1D95" stroke-width="1.6"/>
	<polygon points="70,63 73,69 79,70 74,75 75,82 70,78 65,82 66,75 61,70 67,69" fill="url(#ks-gem)" stroke="#4C1D95" stroke-width="0.5"/>
	<!-- Stem -->
	<rect x="58" y="96" width="24" height="16" fill="url(#ks-base)"/>
	<!-- Base -->
	<rect x="42" y="112" width="56" height="11" rx="2" fill="url(#ks-base)"/>
	<rect x="32" y="123" width="76" height="14" rx="3" fill="url(#ks-base)"/>
	<rect x="26" y="137" width="88" height="6" rx="2" fill="#2E1065"/>
	<!-- Floor shadow -->
	<ellipse cx="70" cy="148" rx="40" ry="3" fill="rgba(0,0,0,0.25)"/>
</svg>
