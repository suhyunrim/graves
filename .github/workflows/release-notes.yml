name: Daily Release Notes

on:
  schedule:
    # 매일 아침 6시 KST (= 전날 21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행도 가능
    inputs:
      since:
        description: '시작 날짜(YYYY-MM-DD, 이 날짜 다음날부터). 미지정 시 release-notes.json 최신 항목 날짜'
        required: false
      until:
        description: '종료 날짜(YYYY-MM-DD, 그 날 포함). 미지정 시 어제. 날짜별로 항목이 하나씩 생성된다'
        required: false

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0

      - name: Generate release notes
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          ARGS=""
          if [ -n "$INPUT_SINCE" ]; then ARGS="$ARGS --since=$INPUT_SINCE"; fi
          if [ -n "$INPUT_UNTIL" ]; then ARGS="$ARGS --until=$INPUT_UNTIL"; fi
          node scripts/generate-release-notes.mjs $ARGS

      - name: Commit and push to prod
        if: steps.gen.outputs.versions != ''
        env:
          VERSIONS: ${{ steps.gen.outputs.versions }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/release-notes.json
          git commit -m "릴리즈 노트 자동 업데이트 v$VERSIONS"
          git push origin prod

      - name: Merge to master
        if: steps.gen.outputs.versions != ''
        run: |
          git checkout master
          git merge prod --no-edit
          git push origin master
